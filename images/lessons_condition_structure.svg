<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <marker 
            id="arrow-head-marker"
            viewBox="0 0 10 10" 
            refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555" />
        </marker>

        <polygon
            id="conditional"
            refX="0" refY="0"
            points= "0 -40, 40 0, 0 40, -40 0"
            fill="#ff4444"
        />

    </defs>

    <rect width="100%" height="100%" fill="#222222"/>

    <g transform="translate(300, 25)">
        
        <!--
        ==========================================================================
            Lines / arrows
        ==========================================================================
        -->

        <line x1="0" y1="120" x2="0" y2="178" stroke="#555555" stroke-width="3" marker-end="url(#arrow-head-marker)"/>
        <line x1="0" y1="20" x2="0" y2="78" stroke="#555555" stroke-width="3" marker-end="url(#arrow-head-marker)"/>
        <line x1="0" y1="220" x2="0" y2="278" stroke="#555555" stroke-width="3" marker-end="url(#arrow-head-marker)"/>
        
        <!--
        ==========================================================================
            Nodes
        ==========================================================================
        -->

        <ellipse cx="0" cy="0" rx="20" ry="20" fill="#999999" stroke="#555555" stroke-width="2"/>
        <use href="#conditional" x="0" y="100" />
        <ellipse cx="0" cy="200" rx="20" ry="20" fill="#999999" stroke="#555555" stroke-width="2"/>
        <ellipse cx="0" cy="300" rx="20" ry="20" fill="#999999" stroke="#555555" stroke-width="2"/>
        
    </g>

</svg>
