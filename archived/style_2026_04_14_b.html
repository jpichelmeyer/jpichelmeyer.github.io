<head>
    <!-- index.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jacob Pichelmeyer, PhD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">

    <!--

    <style>
    

     /* 
    ══════════════════════════════════════════════════════════==============
       
        0. GLOBAL           In theory, applies to absolutely everything

    ══════════════════════════════════════════════════════════==============
    */
        :root {
            --border_radius_thumb:          5px;
            --border_style_thumb:           solid;
-			--brightness_social: 			brightness(0%);
            --color_about:                  #9b3050;
            --color_accent:                 #2a4878;
            --color_announcements:          #a33340;
            --color_assessment:             #bf7a41;
            --color_beat_image:             #4a7fa5;
            --color_beat_text:              #888;
            --color_career:                 #8a7830;
            --color_core:                   #f1f1f1;
            --color_course:                 #609aa6;
            --color_highlight:              #060606;
            --color_instructor:     		#60a688;
            --color_lessons:        		#6083a6;
            --color_lowlight:               #4f4f4f;
            --color_meeting:        		#a69860;
            --color_policies:       		#a66079;
            --color_research:               #2a6055;
            --color_schedule:      			#8d679e;
            --color_teaching:               #364880;
            --color_wrap:                   #f1f1f1;
            --handle_color_active:  		#ff00ff;
            --handle_color_hover:   		rgba(0,0,0,0.22);
            --handle_color:         		rgba(0,0,0,0.10);
            --handle_height:        		6px;
            --handle_width:         		6px;
            --icon_size_social:             15px;
            --main_section_card_width: 		550px;
            --margin_left:                  200px;
            --margin_left:          		200px;
            --opacity_timeline:             0.25;
            --panel_bg:             		#ffffff;
            --panel_border:         		rgba(0,0,0,0.10);
            --panel_strip_height:   		90px;
            --panel_thumb_width:    		152px;
            --panel_visual_height:  		260px;
            --panel_width:          		800px;
            --size_research_thumb_width:    170px;
        }

        body[data-color="rose"]    { --color_accent: #8c2f4a; }
        body[data-color="crimson"] { --color_accent: #8f2020; }
        body[data-color="rust"]    { --color_accent: #8a3e18; }
        body[data-color="amber"]   { --color_accent: #7a5c14; }
        body[data-color="gold"]    { --color_accent: #7a6c1a; }
        body[data-color="teal"]    { --color_accent: #1e5c58; }
        body[data-color="forest"]  { --color_accent: #28502e; }
        body[data-color="slate"]   { --color_accent: #3a5068; }
        body[data-color="navy"]    { --color_accent: #2a4878; }
        body[data-color="indigo"]  { --color_accent: #38357a; }
        body[data-color="plum"]    { --color_accent: #5a2e68; }
        body[data-color="stone"]   { --color_accent: #4a4646; }

        a { color: var(--color_accent); text-decoration: underline; }
        a:hover { color: var(--color_highlight); text-decoration: none; }

        h1, .page_heading { font-family: 'Merriweather', serif; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: var(--color_lowlight);
            background-color: var(--color_wrap);
        }

        body.resizing { user-select: none; cursor: col-resize; }
        body.resizing-v { user-select: none; cursor: row-resize; }

        .back_link {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--color_lowlight);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 16px;
            opacity: 0.55;
            transition: opacity 0.2s ease, color 0.2s ease;
        }
        .back_link::before { content: '◀'; font-size: 7px; color: var(--color_accent); }
        .back_link:hover { opacity: 1; color: var(--color_highlight); text-decoration: none; }

        * { box-sizing: border-box; }

        .row {
            display: flex;
            overflow-x: hidden;
        }

        .side_left {
            background-color: var(--color_wrap);
            padding: 20px;
            width: var(--margin_left);
            position: fixed;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .main {
            flex: 1;
            margin-left: var(--margin_left);
            padding: 0;
            height: 100%;
            overflow: auto;
            transition: margin-right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.panel-open .main {
            margin-right: var(--panel_width);
        }
        body.resizing .main { transition: none; }

    /* 
    ══════════════════════════════════════════════════════════==============
       
        1. SYSTEM           Managing / Navigation the entire system

    ══════════════════════════════════════════════════════════==============
    */

        /*
        ---------------------------------------------------
            Machine / OS button     wrapper
        ---------------------------------------------------
        */
        .top-level-machine-os-btn-wrapper {
            display: grid;
            grid-template-columns: repeat(3, lfr); 
            gap: 10px;               
        }

        .pos-return-wrapper {
            left: 0;
            width: 100%;
            display: flex;
            justify-content: left;
            padding: 20px 20px;
            box-sizing: border-box;
        }
        #pos-return-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color_lowlight);
            opacity: 0.6;
            transition: 
                color 0.25s ease, 
                opacity 0.25s ease, 
                transform 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67),
                box-shadow 0.3s ease;
        }
        #pos-return-btn svg {
            width: 36px; 
            height: 36px;
        }
        #pos-return-btn:hover {
            opacity: 1;
            color: var(--color_highlight);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }
        #pos-return-btn:active {
            transform: scale(0.95);
            transition: transform 0.05s ease;
        }
        @keyframes pos-pulse {
            0% { box-shadow: 0 0 8px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 18px rgba(255, 255, 255, 0.25); }
            100% { box-shadow: 0 0 8px rgba(255, 255, 255, 0.1); }
        }

    /* 
    ══════════════════════════════════════════════════════════==============
       
        2. APPLICATION       Individual applications

    ══════════════════════════════════════════════════════════==============
    */
        
        /* 
        ══════════════════════════════════════════════════════════
           Terminal
        ══════════════════════════════════════════════════════════ 
        */
		
		#computer-drawer {
    		left: 0;
    		width: 100%;
    		padding-left: var(--margin_left);
    		transform: translateX(-100%);
		}
        #computer-drawer.drawer-open ~ .side_left #pos-return-btn {
            opacity: 1;
            color: var(--color_highlight);
            animation: pos-pulse 2s infinite;
        }


        /*
        ===================================================================
        ===================================================================
        ===================================================================
        */

	/* 
    ══════════════════════════════════════════════════════════==============
       
        3b. FORMATTING       LESSONS        

    ══════════════════════════════════════════════════════════==============
    */
    
    	/* 
        ══════════════════════════════════════════════════════════
           Navigation Bar
        ══════════════════════════════════════════════════════════ 
        */
        
        
        .navbar { padding-top: 16px; display: flex; flex-direction: column; gap: 3px; }
		
		.navbar a {
    		position: relative;
    		display: block;
    		padding: 7px 10px 7px 12px;
    		font-size: 11px;
    		font-weight: 600;
    		letter-spacing: 0.09em;
    		color: var(--color_lowlight);
    		text-decoration: none;
    		border-radius: 0 8px 8px 0;
    		border-left: 3px solid transparent;
    		overflow: hidden;
    		transition: color 0.22s ease, border-left-color 0.22s ease;
		}
		.navbar a::before {
    		content: '';
    		position: absolute;
    		inset: 0;
    		border-radius: 0 8px 8px 0;
    		transform: scaleX(0);
    		transform-origin: left center;
    		transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    		z-index: 0;
		}
		.navbar a span { position: relative; z-index: 1; }
		.navbar a:hover { color: var(--color_highlight); }
		.navbar a:hover::before { transform: scaleX(1); }
		
		/* index.html anchors */
		.navbar a[href="#about"]       { border-left-color: var(--color_about); }
		.navbar a[href="#about"]::before { background: var(--color_about); opacity: 0.20; }
		.navbar a[href="#careerPath"]  { border-left-color: var(--color_career); }
		.navbar a[href="#careerPath"]::before { background: var(--color_career); opacity: 0.20; }
		.navbar a[href="#research"]    { border-left-color: var(--color_research); }
		.navbar a[href="#research"]::before { background: var(--color_research); opacity: 0.22; }
		.navbar a[href="#teaching"]    { border-left-color: var(--color_teaching); }
		.navbar a[href="#teaching"]::before { background: var(--color_teaching); opacity: 0.22; }
		
		/* course.html anchors */
		.navbar a[href="#section_announcements"] { border-left-color: var(--color_announcements); }
		.navbar a[href="#section_announcements"]::before { background: var(--color_announcements); opacity: 0.20; }
		.navbar a[href="#section_assessment"] { border-left-color: var(--color_assessment); }
		.navbar a[href="#section_assessment"]::before { background: var(--color_assessment); opacity: 0.20; }
		.navbar a[href="#section_course"] { border-left-color: var(--color_course); }
		.navbar a[href="#section_course"]::before { background: var(--color_course); opacity: 0.20; }
		.navbar a[href="#section_instructor"] { border-left-color: var(--color_instructor); }
		.navbar a[href="#section_instructor"]::before { background: var(--color_instructor); opacity: 0.20; }
		.navbar a[href="#section_lessons"] { border-left-color: var(--color_lessons); }
		.navbar a[href="#section_lessons"]::before { background: var(--color_lessons); opacity: 0.20; }
		.navbar a[href="#section_meeting"] { border-left-color: var(--color_meeting); }
		.navbar a[href="#section_meeting"]::before { background: var(--color_meeting); opacity: 0.20; }
		.navbar a[href="#section_policies"] { border-left-color: var(--color_policies); }
		.navbar a[href="#section_policies"]::before { background: var(--color_policies); opacity: 0.20; }
		.navbar a[href="#section_schedule"] { border-left-color: var(--color_schedule); }
		.navbar a[href="#section_schedule"]::before { background: var(--color_schedule); opacity: 0.20; }
        


        /* 
        ══════════════════════════════════════════════════════════
           Courses
        ══════════════════════════════════════════════════════════ 
        */
        .course_gif {
            display: block;
            width: 160px;
            height: auto;
            margin: 0 0 14px 0;
            image-rendering: pixelated;
            border-radius: 3px;
        }

        .course_id_block { margin-bottom: 12px; }

        .course_id_code {
            font-size: 20px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--color_accent);
            margin-bottom: 4px;
        }

        .course_id_title {
            color: var(--color_highlight);
            font-size: 16px;
            font-weight: 400;
            line-height: 1.35;
        }

        .side_divider { border: none; border-top: 1px solid rgba(0,0,0,0.10); margin: 10px 0; }
        .side_info_block { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
        .side_info_row { display: flex; flex-direction: column; gap: 1px; }

        .side_info_label {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--color_accent);
            opacity: 0.80;
        }

        .side_info_value { font-size: 11px; color: var(--color_lowlight); line-height: 1.4; }

        /* 
        ══════════════════════════════════════════════════════════
           Section cards (Announcements, Lessons, ...)
        ══════════════════════════════════════════════════════════ 
        */
        .main_section {
            width: var(--main_section_card_width);
            margin-bottom: 30px;
            border-radius: 10px;
            background: rgba(255,255,255,0.75);
            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
            overflow: hidden;
        }

        .section_heading_bar {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            border-radius: 10px 10px 0 0;
            background: var(--color_accent);
        }

        .section_heading_bar-announcements { background: var(--color_announcements); }
        .section_heading_bar-assessment    { background: var(--color_assessment); }
        .section_heading_bar-course        { background: var(--color_course); }
        .section_heading_bar-instructor    { background: var(--color_instructor); }
        .section_heading_bar-lessons       { background: var(--color_lessons); }
        .section_heading_bar-meeting       { background: var(--color_meeting); }
        .section_heading_bar-policies      { background: var(--color_policies); }
        .section_heading_bar-schedule      { background: var(--color_schedule); }

        .section_heading_bar .page_heading {
            margin: 0;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }
		
		/*
        .section_body p { margin: 10px 0 4px; font-size: 13px; }
		*/

        /* 
        ══════════════════════════════════════════════════════════
           Lessons
        ══════════════════════════════════════════════════════════ 
        */

        /* ── Lessons list ── */
        .lesson_list { list-style: none; padding: 8px 0 4px; margin: 0; display: flex; flex-direction: column; gap: 6px; }

        .lesson_item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(0,0,0,0.03);
            transition: background 0.18s ease;
        }
        .lesson_item:hover { background: rgba(0,0,0,0.055); }

        .lesson_item_meta { display: flex; flex-direction: column; gap: 2px; }

        .lesson_item_num {
            font-family: 'Courier New', monospace;
            font-size: 9px;
            letter-spacing: 0.08em;
            color: var(--color_lessons);
            opacity: 0.85;
        }

        .lesson_item_title { font-size: 12px; font-weight: 600; color: var(--color_highlight); }

        .lesson_open_btn {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 11px;
            border: none;
            border-radius: 5px;
            background: var(--color_lessons);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.07em;
            cursor: pointer;
            opacity: 0.85;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .lesson_open_btn::after { content: '▶'; font-size: 7px; }
        .lesson_open_btn:hover { opacity: 1; transform: scale(1.04); }
        .lesson_open_btn.active { background: var(--color_highlight); opacity: 0.5; }

        /* 
        ═══════════════════════════════════════════════════════════
           LESSON PANEL
        ═══════════════════════════════════════════════════════════
         */
        .lesson_panel {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--panel_width);
            height: 100vh;
            background: var(--panel_bg);
            border-left: 1px solid var(--panel_border);
            box-shadow: -4px 0 24px rgba(0,0,0,0.10);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            /* min/max width constraints for panel resize */
            min-width: 320px;
            max-width: 100vw;
        }

        body.panel-open .lesson_panel { transform: translateX(0); }
        body.resizing .lesson_panel   { transition: none; }

        /* ── Panel header ── */
        .panel_header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 10px 16px;
            background: var(--color_lessons);
            flex-shrink: 0;
            position: relative; /* stacking context for the reset button */
        }

        .panel_header_title {
            font-family: 'Merriweather', serif;
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.25);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }

        .panel_header_actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        /* Reset layout button */
        .panel_reset_btn {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 4px;
            color: rgba(255,255,255,0.70);
            font-size: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: 0.06em;
            padding: 4px 8px;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease;
            white-space: nowrap;
        }
        .panel_reset_btn:hover { background: rgba(255,255,255,0.28); color: #fff; }

        .panel_close_btn {
            flex-shrink: 0;
            background: rgba(255,255,255,0.20);
            border: none;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            line-height: 1;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.18s ease;
        }
        .panel_close_btn:hover { background: rgba(255,255,255,0.38); }

        /* 
        ══════════════════════════════════════════════════════════
           RESIZE HANDLES
        ══════════════════════════════════════════════════════════ 
        */

        /* ── Handle 1: left edge of panel — resize panel WIDTH ── */
        .panel_resize_left {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--handle_width);
            cursor: col-resize;
            background: var(--handle_color);
            z-index: 200;
            transition: background 0.18s ease;
            /* visual groove */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel_resize_left:hover,
        .panel_resize_left.dragging { background: var(--handle_color_active); }

        /* Three-dot grip indicator */
        .panel_resize_left::after {
            content: '';
            display: block;
            width: 2px;
            height: 28px;
            background: rgba(255,255,255,0.55);
            border-radius: 2px;
            pointer-events: none;
        }

        /* ── Handle 2: below visual area — resize VISUAL HEIGHT ── */
        .panel_resize_visual {
            flex-shrink: 0;
            height: var(--handle_height);
            cursor: row-resize;
            background: var(--handle_color);
            position: relative;
            z-index: 10;
            transition: background 0.18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel_resize_visual:hover,
        .panel_resize_visual.dragging { background: var(--handle_color_active); }

        .panel_resize_visual::after {
            content: '';
            display: block;
            width: 28px;
            height: 2px;
            background: rgba(255,255,255,0.55);
            border-radius: 2px;
            pointer-events: none;
        }

        /* ── Handle 3: above strip — resize STRIP HEIGHT ── */
        .panel_resize_strip {
            flex-shrink: 0;
            height: var(--handle_height);
            cursor: row-resize;
            background: var(--handle_color);
            position: relative;
            z-index: 10;
            transition: background 0.18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .panel_resize_strip:hover,
        .panel_resize_strip.dragging { background: var(--handle_color_active); }

        .panel_resize_strip::after {
            content: '';
            display: block;
            width: 28px;
            height: 2px;
            background: rgba(255,255,255,0.55);
            border-radius: 2px;
            pointer-events: none;
        }

        /* ── Visual area (TOP ROW) ── */
        .panel_visual_area {
            flex-shrink: 0;
            height: var(--panel_visual_height);
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            /* min/max constraints */
            min-height: 80px;
            max-height: calc(100vh - 200px);
            /* hiding visual panel for text_only */
            transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Hiding visual area for "text_only" type lesson beats */
        .panel_visual_area.hidden,
        .panel_resize_visual.hidden {
            height: 0 !important;
            min-height: 0 !important;
            overflow: hidden;
            transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Beat counter badge */
        .panel_beat_counter {
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(0,0,0,0.40);
            color: rgba(255,255,255,0.60);
            font-family: 'Courier New', monospace;
            font-size: 9px;
            letter-spacing: 0.08em;
            padding: 2px 7px;
            border-radius: 10px;
            z-index: 2;
        }

        /* Type badge (top-left) */
        .panel_type_badge {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 10px;
            z-index: 2;
            background: rgba(0,0,0,0.35);
            color: rgba(255,255,255,0.70);
        }

        /* 
        ══════════════════════════════════════════════════════════
           Lesson Beat: Image
        ══════════════════════════════════════════════════════════ 
        */
        .beat_image_img {
            max-width: 100%;
            max-height: calc(var(--panel_visual_height) - 36px);
            object-fit: contain;
            border-radius: 4px;
        }

        .beat_caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 5px 12px;
            background: rgba(0,0,0,0.45);
            color: rgba(255,255,255,0.70);
            font-size: 10px;
            font-style: italic;
            letter-spacing: 0.04em;
            text-align: center;
        }

        /* 
        ══════════════════════════════════════════════════════════
           Quiz
        ══════════════════════════════════════════════════════════ 
        */
        .beat_quiz_wrap {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 14px 16px 10px;
            gap: 10px;
        }

        .beat_quiz_question {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255,255,255,0.88);
            line-height: 1.5;
            flex-shrink: 0;
        }

        .beat_quiz_choices {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .beat_quiz_choice {
            padding: 7px 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            color: rgba(255,255,255,0.75);
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            font-family: 'Inter', sans-serif;
            transition: background 0.16s, border-color 0.16s;
        }
        .beat_quiz_choice:hover:not(:disabled) { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.28); }
        .beat_quiz_choice.correct { background: rgba(80,180,100,0.25); border-color: #7ecb8f; color: #b2f0be; }
        .beat_quiz_choice.wrong   { background: rgba(200,80,80,0.22); border-color: #e07878; color: #f4b0b0; }
        .beat_quiz_choice:disabled { cursor: default; }

        .beat_quiz_feedback {
            font-size: 11px;
            font-style: italic;
            color: rgba(255,255,255,0.45);
            flex-shrink: 0;
            min-height: 16px;
        }

        /* ── text_only beat ── */
        .beat_text_only_wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 24px;
        }

        .beat_text_only_quote {
            border-left: 3px solid rgba(255,255,255,0.25);
            padding-left: 16px;
            color: rgba(255,255,255,0.65);
            font-size: 13px;
            line-height: 1.7;
            font-style: italic;
        }

        /* 
        ══════════════════════════════════════════════════════════
           Lesson Beat: Unknown
        ══════════════════════════════════════════════════════════ 
        */
        .panel_visual_placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.25);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .panel_visual_placeholder::before { content: ' '; font-size: 32px; opacity: 0.18; }

        

        /* ── Beat text (MIDDLE) ── */
        .panel_beat_text_area {
            flex: 1;
            padding: 14px 16px 10px;
            overflow-y: auto;
            min-height: 60px;
        }

        .panel_beat_text {
            font-size: 13px;
            line-height: 1.65;
            color: var(--color_lowlight);
        }

        .panel_beat_text em { color: var(--color_accent); font-style: normal; font-weight: 600; }

        .panel_beat_empty {
            color: rgba(0,0,0,0.25);
            font-size: 12px;
            font-style: italic;
            text-align: center;
            padding-top: 20px;
        }

        /* ── Thumbnail strip (BOTTOM ROW) ── */
        .panel_strip_area {
            flex-shrink: 0;
            height: var(--panel_strip_height);
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f7f7f8;
            border-top: 1px solid rgba(0,0,0,0.07);
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            /* min/max for strip resize */
            min-height: 60px;
            max-height: 300px;
        }

        .panel_strip_area::after { content: ''; flex-shrink: 0; width: 10px; }

        /* ── Beat pill (replaces old thumbnail card) ── */
        .beat_pill {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid transparent;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.09);
            cursor: pointer;
            min-width: 64px;
            max-width: 100px;
            height: calc(var(--panel_strip_height) - 20px);
            transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s, background 0.15s;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .beat_pill:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.14); transform: translateY(-2px); }

        /* Colored left-edge accent bar */
        .beat_pill::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 8px 0 0 8px;
            background: var(--pill-color, #888);
        }

        /* Beat number — large and monospaced */
        .beat_pill_num {
            font-family: 'Courier New', monospace;
            font-size: 17px;
            font-weight: 700;
            line-height: 1;
            color: var(--pill-color, #888);
            letter-spacing: -0.02em;
        }

        /* Keyword / mini-title */
        .beat_pill_label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--color_lowlight);
            line-height: 1.3;
            word-break: break-word;
            hyphens: auto;
            max-width: 80px;
        }

        /* Selected state — colored border + light tinted bg */
        .beat_pill.selected {
            border-color: var(--pill-color, #888);
            background: color-mix(in srgb, var(--pill-color, #888) 8%, white);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--pill-color, #888) 18%, transparent);
        }

        /* Fallback for browsers without color-mix */
        @supports not (background: color-mix(in srgb, red 10%, white)) {
            .beat_pill.selected { background: #f0f4fa; }
        }

        /* ── Error state ── */
        #error-msg {
            display: none;
            max-width: 580px;
            margin: 4rem auto;
            padding: 2rem;
            background: #fff3f3;
            border: 1px solid #f5c6c6;
            border-radius: 6px;
            color: #a00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
