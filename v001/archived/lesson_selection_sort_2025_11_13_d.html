<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Sort Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .sidebar {
            background: #f7f9fc;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .value-display {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
            color: #667eea;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 100px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-play {
            background: #10b981;
            color: white;
        }

        .btn-pause {
            background: #f59e0b;
            color: white;
        }

        .btn-step {
            background: #3b82f6;
            color: white;
        }

        .btn-reset {
            background: #ef4444;
            color: white;
        }

        .btn-generate {
            background: #8b5cf6;
            color: white;
            width: 100%;
        }

        .progress-container {
            width: 100%;
            height: 30px;
            background: #e5e7eb;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .chart-container {
            height: 400px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 20px;
            background: #f7f9fc;
            border-radius: 12px;
            margin-bottom: 20px;
            gap: 2px;
        }

        .bar {
            flex: 1;
            max-width: 50px;
            background: skyblue;
            border-radius: 4px 4px 0 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: #333;
            font-size: 12px;
            font-weight: bold;
            padding-bottom: 5px;
        }

        .bar.sorted {
            background: #C8A2C8;
        }

        .bar.min {
            background: orange;
        }

        .bar.comparing {
            background: red;
        }

        .bar.faded {
            opacity: 0.5;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 18px;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
        }

        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .info-box strong {
            color: #1e40af;
        }

        .memory-section {
            background: #fff7ed;
            border: 2px solid #fb923c;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .memory-section h2 {
            color: #ea580c;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-align: center;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .memory-cell {
            background: white;
            border: 2px solid #fdba74;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .memory-label {
            font-size: 12px;
            color: #9a3412;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .memory-value {
            font-size: 24px;
            font-weight: bold;
            color: #ea580c;
            font-family: 'Courier New', monospace;
        }

        .memory-description {
            font-size: 11px;
            color: #78716c;
            margin-top: 5px;
            font-style: italic;
        }

        .memory-highlight {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(251, 146, 60, 0.5); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Selection Sort Visualizer</h1>

        <div class="sidebar">
            <div class="control-group">
                <label>Array Size: <span class="value-display" id="sizeValue">10</span></label>
                <input type="range" id="arraySize" min="5" max="30" value="10">
            </div>
            <div class="control-group">
                <label>Animation Speed (seconds): <span class="value-display" id="speedValue">0.20</span></label>
                <input type="range" id="animSpeed" min="0.02" max="1.0" step="0.02" value="0.20">
            </div>
            <button class="btn-generate" onclick="generateNewArray()">Generate New Random Array</button>
        </div>

        <div class="controls">
            <button class="btn-play" onclick="play()">Play</button>
            <button class="btn-pause" onclick="pause()">Pause</button>
            <button class="btn-step" onclick="step()">Step</button>
            <button class="btn-reset" onclick="reset()">Reset</button>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%">0%</div>
        </div>

        <div class="memory-section">
            <h2>💾 Memory Usage (O(1) - Constant Space)</h2>
            <div class="memory-grid">
                <div class="memory-cell" id="memoryI">
                    <div class="memory-label">Variable: i</div>
                    <div class="memory-value" id="memoryIValue">0</div>
                    <div class="memory-description">Base index (where min will be swapped)</div>
                </div>
                <div class="memory-cell" id="memoryJ">
                    <div class="memory-label">Variable: j</div>
                    <div class="memory-value" id="memoryJValue">0</div>
                    <div class="memory-description">Current comparison index</div>
                </div>
                <div class="memory-cell" id="memoryMinIdx">
                    <div class="memory-label">Variable: min_idx</div>
                    <div class="memory-value" id="memoryMinIdxValue">0</div>
                    <div class="memory-description">Index of minimum value found</div>
                </div>
                <div class="memory-cell" id="memoryMinVal">
                    <div class="memory-label">Variable: min_val</div>
                    <div class="memory-value" id="memoryMinValValue">-</div>
                    <div class="memory-description">Minimum value found so far</div>
                </div>
            </div>
        </div>

        <div id="status" class="status info" style="display: none;"></div>

        <div class="chart-container" id="chartContainer"></div>

    </div>

    <script>
        // State management
        let state = {
            array: [],
            sorted: false,
            i: 0,
            j: 0,
            min_idx: 0,
            playing: false,
            step_once: false,
            n: 10,
            delay: 0.2
        };

        // Initialize
        function init() {
            state.n = parseInt(document.getElementById('arraySize').value);
            state.delay = parseFloat(document.getElementById('animSpeed').value);
            generateRandomArray();
            updateSliderDisplays();
        }

        function generateRandomArray() {
            state.array = [];
            for (let i = 0; i < state.n; i++) {
                state.array.push(Math.floor(Math.random() * 99) + 1);
            }
            resetState();
        }

        function resetState() {
            state.sorted = false;
            state.i = 0;
            state.j = 0;
            state.min_idx = 0;
            state.playing = false;
            state.step_once = false;
            updateProgress();
            updateMemoryDisplay();
            drawArray();
            hideStatus();
        }

        function generateNewArray() {
            generateRandomArray();
        }

        function reset() {
            generateRandomArray();
        }

        function play() {
            if (!state.sorted) {
                state.playing = true;
                state.step_once = false;
                runSortingStep();
            }
        }

        function pause() {
            state.playing = false;
        }

        function step() {
            if (!state.sorted) {
                state.step_once = true;
                state.playing = false;
                runSortingStep();
            }
        }

        // Update slider value displays
        function updateSliderDisplays() {
            document.getElementById('sizeValue').textContent = state.n;
            document.getElementById('speedValue').textContent = state.delay.toFixed(2);
        }

        document.getElementById('arraySize').addEventListener('input', function(e) {
            const newSize = parseInt(e.target.value);
            if (newSize !== state.n) {
                state.n = newSize;
                // Resize array
                if (state.array.length < newSize) {
                    while (state.array.length < newSize) {
                        state.array.push(Math.floor(Math.random() * 99) + 1);
                    }
                } else {
                    state.array = state.array.slice(0, newSize);
                }
                resetState();
            }
            updateSliderDisplays();
        });

        document.getElementById('animSpeed').addEventListener('input', function(e) {
            state.delay = parseFloat(e.target.value);
            updateSliderDisplays();
        });

        // Drawing function
        function drawArray(titleExtra = '') {
            const container = document.getElementById('chartContainer');
            container.innerHTML = '';
            
            const maxVal = Math.max(...state.array);
            const n = state.array.length;

            state.array.forEach((val, k) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                
                // Determine color
                if (k < state.i) {
                    bar.classList.add('sorted');
                } else if (k === state.min_idx && (state.j !== 0 || state.i === state.min_idx)) {
                    bar.classList.add('min');
                } else if (k === state.j && state.j < n) {
                    bar.classList.add('comparing');
                }

                // Fade elements beyond current comparison
                if (k >= state.i && state.j > 0 && k > state.j - 1) {
                    bar.classList.add('faded');
                }

                const height = (val / maxVal) * 100;
                bar.style.height = height + '%';
                bar.textContent = val;
                
                container.appendChild(bar);
            });
        }

        function updateProgress() {
            const progress = state.i / Math.max(1, state.array.length);
            const percentage = Math.round(progress * 100);
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percentage + '%';
            progressBar.textContent = percentage + '%';
        }

        function updateMemoryDisplay(highlightCell = null) {
            document.getElementById('memoryIValue').textContent = state.i;
            document.getElementById('memoryJValue').textContent = state.j;
            document.getElementById('memoryMinIdxValue').textContent = state.min_idx;
            
            const minVal = state.array[state.min_idx];
            document.getElementById('memoryMinValValue').textContent = minVal !== undefined ? minVal : '-';

            // Remove previous highlights
            document.querySelectorAll('.memory-cell').forEach(cell => {
                cell.classList.remove('memory-highlight');
            });

            // Add highlight to specific cell if specified
            if (highlightCell) {
                const cell = document.getElementById(highlightCell);
                if (cell) {
                    cell.classList.add('memory-highlight');
                }
            }
        }

        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            statusEl.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }

        // Main sorting logic
        async function runSortingStep() {
            const n = state.array.length;
            
            while (state.i < n) {
                // Initialize for new pass
                if (state.j === 0) {
                    state.min_idx = state.i;
                    state.j = state.i + 1;
                    updateMemoryDisplay('memoryI');
                }

                // Scanning phase
                if (state.j < n) {
                    drawArray('(scanning)');
                    updateMemoryDisplay('memoryJ');
                    await sleep(state.delay * 500);

                    // Compare
                    if (state.array[state.j] < state.array[state.min_idx]) {
                        state.min_idx = state.j;
                        updateMemoryDisplay('memoryMinIdx');
                        await sleep(state.delay * 300);
                    }

                    state.j++;
                    updateProgress();

                    if (state.step_once) {
                        state.step_once = false;
                        return;
                    }

                    if (!state.playing) {
                        return;
                    }

                    continue;
                }

                // Swap phase (j >= n)
                if (state.j >= n) {
                    if (state.min_idx !== state.i) {
                        [state.array[state.i], state.array[state.min_idx]] = 
                        [state.array[state.min_idx], state.array[state.i]];
                    }

                    state.i++;
                    state.j = 0;
                    state.min_idx = state.i;

                    drawArray('(after swap)');
                    updateMemoryDisplay();
                    await sleep(state.delay * 1000);
                    updateProgress();

                    if (state.step_once) {
                        state.step_once = false;
                        return;
                    }

                    if (!state.playing) {
                        return;
                    }

                    continue;
                }
            }

            // Sorting complete
            if (state.i >= n) {
                state.sorted = true;
                state.playing = false;
                showStatus('Sorting complete!', 'success');
                updateMemoryDisplay();
                drawArray();
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Initialize on load
        window.onload = init;
    </script>
</body>
</html>
