<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>K-means p4</title>
<style>
body {
    font-family: system-ui, sans-serif;
    background: #f7f7f7;
    margin:0; padding:20px;
}
h1 { margin-top:0; }
.container { display:flex; gap:20px; }
.controls { width:350px; background:#fff; padding:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.12);}
label { font-weight:600; margin-top:10px; display:block; }
input[type=range], button { width:100%; margin-top:6px; padding:6px; }
#documentContainer { width:100%; max-height:400px; overflow-y:auto; margin-top:10px; display:flex; flex-direction:column; gap:6px;}
.docBox { padding:10px; border-radius:6px; color:#fff; font-size:12px; white-space:pre-wrap; }

table { border-collapse: collapse; width: 100%; margin-top:10px; font-size:12px;}
th, td { border:1px solid #ddd; padding:4px; text-align:right;}
th { background:#f0f0f0; text-align:center;}
.scrollTable { overflow-x:auto; max-height:200px; }
</style>
</head>
<body>

<h1>K-means application: Document clustering</h1>

<div class="container">
  <div class="controls">
    <label>Number of documents: <span id="numDocsLabel">20</span></label>
    <input type="range" min="4" max="40" value="8" step="1" oninput="updateNumDocs(this.value)">
    <label>Vocabulary size: <span id="vocabSizeLabel">15</span></label>
    <input type="range" min="2" max="30" value="5" step="1" oninput="updateVocabSize(this.value)">
    <label>Document length min: <span id="docMinLabel">5</span></label>
    <input type="range" min="2" max="20" value="3" step="1" oninput="updateDocMin(this.value)">
    <label>Document length max: <span id="docMaxLabel">10</span></label>
    <input type="range" min="5" max="30" value="6" step="1" oninput="updateDocMax(this.value)">
    <button onclick="generateDocuments()">Generate Documents</button>

    <label>Number of clusters (K): <span id="kLabel">3</span></label>
    <input type="range" min="2" max="10" value="3" step="1" oninput="updateK(this.value)">
    <button onclick="runKMeans()">Run K-means</button>

    <label>TF-IDF Table (first 5 docs shown)</label>
    <div class="scrollTable">
      <table id="tfidfTable"></table>
    </div>
  </div>

  <div id="documentContainer">
    <!-- Clustered documents appear here -->
  </div>
</div>

<script>
let numDocs=20, vocabSize=15, docMin=5, docMax=10, K=3;
let sampleWords=["cat","dog","tree","car","house","sun","moon","river","book","computer","flower","music","city","food","bird","mountain","river","star","child","dream","light","fire","ocean","sky","road","game","art","school","leaf","wind","night","heart"];
let vocabulary=[], documents=[], tfidfVectors=[], assignments=[];

const clusterColors=["#e41a1c","#377eb8","#4daf4a","#984ea3","#ff7f00","#ffff33","#a65628","#f781bf","#999999"];

// Slider labels
function updateNumDocs(v){numDocs=parseInt(v); document.getElementById("numDocsLabel").textContent=v;}
function updateVocabSize(v){vocabSize=parseInt(v); document.getElementById("vocabSizeLabel").textContent=v;}
function updateDocMin(v){docMin=parseInt(v); document.getElementById("docMinLabel").textContent=v;}
function updateDocMax(v){docMax=parseInt(v); document.getElementById("docMaxLabel").textContent=v;}
function updateK(v){K=parseInt(v); document.getElementById("kLabel").textContent=v;}

// Generate vocabulary
function generateVocabulary(){ vocabulary = sampleWords.slice(0,vocabSize); }

// Generate documents
function generateDocuments(){
    generateVocabulary();
    documents=[];
    for(let i=0;i<numDocs;i++){
        const len=Math.floor(Math.random()*(docMax-docMin+1))+docMin;
        let doc=[];
        for(let j=0;j<len;j++){
            doc.push(vocabulary[Math.floor(Math.random()*vocabSize)]);
        }
        documents.push(doc.join(" "));
    }
    computeTFIDF();
    assignments=new Array(numDocs).fill(null);
    displayTFIDF();
    displayDocuments();
}

// Compute TF-IDF
function computeTFIDF(){
    const tf=documents.map(doc=>{
        const words=doc.split(/\W+/);
        return vocabulary.map(w=>words.filter(x=>x===w).length);
    });
    const df=vocabulary.map(w=>documents.filter(doc=>doc.includes(w)).length);
    tfidfVectors=tf.map(docVec=>docVec.map((count,i)=>{
        const idf=Math.log(documents.length/(df[i]||1));
        return count*idf;
    }));
}

// Display first 5 TF-IDF vectors
function displayTFIDF(){
    const table=document.getElementById("tfidfTable");
    table.innerHTML="";
    const header=document.createElement("tr");
    header.appendChild(document.createElement("th"));
    vocabulary.forEach(w=>{
        const th=document.createElement("th"); th.textContent=w; header.appendChild(th);
    });
    table.appendChild(header);
    tfidfVectors.slice(0,5).forEach((vec,i)=>{
        const tr=document.createElement("tr");
        const idxTd=document.createElement("td"); idxTd.textContent="Doc "+(i+1); tr.appendChild(idxTd);
        vec.forEach(val=>{
            const td=document.createElement("td"); td.textContent=val.toFixed(2); tr.appendChild(td);
        });
        table.appendChild(tr);
    });
}

// Run K-means in Euclidean space
function runKMeans(){
    if(tfidfVectors.length===0) return;
    assignments=new Array(numDocs);
    let centers=tfidfVectors.slice(0,K).map(v=>v.slice());
    for(let iter=0;iter<5;iter++){
        tfidfVectors.forEach((v,i)=>{
            let best=0, bestDist=Infinity;
            centers.forEach((c,j)=>{
                const d=Math.sqrt(v.reduce((sum,val,idx)=>sum+(val-c[idx])**2,0));
                if(d<bestDist){bestDist=d; best=j;}
            });
            assignments[i]=best;
        });
        centers=centers.map((_,j)=>{
            const group=tfidfVectors.filter((_,i)=>assignments[i]===j);
            if(group.length===0) return centers[j];
            return group[0].map((_,k)=>group.reduce((s,vec)=>s+vec[k],0)/group.length);
        });
    }
    displayDocuments();
}

// Display documents as cluster-colored boxes
function displayDocuments(){
    const container=document.getElementById("documentContainer");
    container.innerHTML="";
    if(assignments.every(a=>a===null)){
        documents.forEach((doc,i)=>{
            const div=document.createElement("div");
            div.className="docBox";
            div.style.backgroundColor="#999";
            div.textContent=doc;
            container.appendChild(div);
        });
    } else {
        for(let c=0;c<K;c++){
            const clusterDocs=documents.map((doc,i)=>({doc,i})).filter(d=>assignments[d.i]===c);
            clusterDocs.forEach(d=>{
                const div=document.createElement("div");
                div.className="docBox";
                div.style.backgroundColor=clusterColors[c%clusterColors.length];
                div.textContent=d.doc;
                container.appendChild(div);
            });
        }
    }
}

// Initialize
generateDocuments();
</script>
</body>
</html>
