<!--
	v001/terminal/terminal.html
-->
<!--
	Styling for the terminal (CLI and text editor) developed for v001/.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- index.html -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Jacob Pichelmeyer, PhD</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">
	
    <script src="terminal/interpreters.js"></script>  <!-- or ./interpreters.js on index.html -->

    <style>
    
    	/*
    	.computer-drawer
                .computer-container
                	.vfs-main
                		.vfs-header
                			.vfs-path
                		.vfs-toolbar
                		.vfs-window
                			.cli-win
                				.cli-header
                				.cli-output
                				.cli-input-area
                			.editor-win
                				vfs-editor
                				.vfs-toolbar
                					.file-tabs
    	*/

        /*
        ========================================================
            Rendering of CLI, Text Editor, Etc
        ========================================================
        */ 
        #computer-drawer {
            position: fixed;
            top: 0;
            /* Start exactly where your main content starts */
            left: var(--margin_left); 
            /* Occupy the remaining width of the screen */
            width: calc(100% - var(--margin_left)); 
            height: 100vh;
            background: var(--color_wrap);
            /* Lower than sidebar (usually 10+), higher than main content */
            z-index: 10; 
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            border-left: 2px solid rgba(255,255,255,0.1);
            font-family: monospace;
            /* white-space: pre;*/
        }

        #computer-drawer.drawer-open {
            transform: translateX(0);
        }

        #computer-drawer {
            /* ... previous positioning ... */
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px; /* Space between windows */
        }

        /* Ensure the sidebar stays on top of the drawer */
        .side_left {
            z-index: 10; 
        }

        /* Internal Layout */
        #computer-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /*
        ========================================================
            Virtual File System 
        ========================================================
        */  

        .vfs-header {
            display: flex;
            justify-content: space-between;
            color: var(--color_highlight);
            background: #f4faed;
            font-size: 14px;
            padding: 14px;
        }

        .vfs-main {
            display: flex;
            flex-direction: column; /* This stacks them vertically */
            gap: 15px;
            height: 100%;
        }
        .vfs-path {
            /*display: flex; */
            /*flex-direction: column; /* This stacks them vertically */
            /*gap: 15px; */
            height: 13px;
            font-size: 14px;
            font-family: monospace;
        }
        .vfs-window {
            flex: 1;
            background: #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 0; /* Important for flex-scroll behavior */
        }

        /* Editor Styling (Light) */
        #vfs-editor {
            border: none;
            font-size: 14px;
            outline: none;
            background: #ffffff;
            color: #222;
            padding: 10px;
            flex: 1;
            resize: none;
        }

        .vfs-toolbar {
            background: #eee;
            padding: 5px;
            display: flex;
            /*gap: 5px; */
            font-size: 20px;
            border-bottom: 1px solid #ddd;
        }

        /*
        ========================================================
            Command Line Interface
        ========================================================
        */ 
        .cli-win { 
            background: #000; 
            color: #0f0; 
         }
        .cli-header { 
            background: #555555; 
            padding: 10px 20px; 
            font-size: 14px; 
            color: #c2ff8a; 
        }
        #cli-output { 
            flex: 1; 
            padding: 0px; 
            overflow-y: auto; 
            white-space: pre-wrap; 
        }
        .cli-input-area { 
            display: flex; 
            padding: 10px 10px 20px 10px; 
            background: #444444; 
            border-top: 1px solid #222;
        }
        #cli-input { 
            background: transparent; 
            border: none; 
            color: #fff; 
            flex: 1; 
            outline: none; 
        }
        .prompt { 
            color: #f5f5f5; 
            margin-right: 10px; 
            margin-left: 5px; 
            font-size: 14px; 
            content: cliCmdPrefix;
        }

        /*
        #close-computer {
            background: transparent;
            border: 1px solid var(--color_lowlight);
            color: var(--color_lowlight);
            cursor: pointer;
            font-size: 10px;
        }
        */

        /*
        ========================================================
            Power button
        ========================================================
        */ 

        /*<!-- <a href="../index.html#teaching" class="back_link"><span>Back to site</span></a> -->*/

        /* Container to fix the button at the bottom of the sidebar */
        .pos-power-wrapper {
            left: 0;
            width: 100%;
            display: flex;
            justify-content: left; /* Center horizontally in sidebar */
            padding: 20px 20px;
            box-sizing: border-box;
        }

        #pos-power-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            
            /* Subtle initial state using your lowlight color */
            color: var(--color_lowlight);
            opacity: 0.6;
            
            /* Smooth transitions for all states */
            transition: 
                color 0.25s ease, 
                opacity 0.25s ease, 
                transform 0.2s cubic-bezier(0.17, 0.67, 0.83, 0.67),
                box-shadow 0.3s ease;
        }

        /* The Power Icon SVG */
        #pos-power-btn svg {
            width: 36px; /* Ideal minimalist size */
            height: 36px;
            fill: currentColor; /* Inherits color from the button */
        }

        /* --- THE HOVER STATE (The satisfying part) --- */
        #pos-power-btn:hover {
            opacity: 1;
            color: var(--color_highlight); /* Ignites to full brightness */
            
            /* Adds a soft, circular glow behind the button */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
            
            /* Gentle scale-up 'pop' */
            transform: scale(1.1);
        }

        /* --- THE ACTIVE STATE (When physically clicked) --- */
        #pos-power-btn:active {
            transform: scale(0.95); /* Slight compress feeling */
            transition: transform 0.05s ease; /* Instant response */
        }

        /* Optional: Subtle 'pulse' animation when POS is open */
        #computer-drawer.drawer-open ~ .side_left #pos-power-btn {
            opacity: 1;
            color: var(--color_highlight);
            animation: pos-pulse 2s infinite;
        }

        @keyframes pos-pulse {
            0% { box-shadow: 0 0 8px rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 18px rgba(255, 255, 255, 0.25); }
            100% { box-shadow: 0 0 8px rgba(255, 255, 255, 0.1); }
        }


        

        /* 
        =======================================================
            
            END     TESTING
        =======================================================
        */
    </style>
</head>


<body>
    <div id="computer-drawer">
        <div id="computer-container">           
            <div class="vfs-main">

                <!--
                ========================================================
                    Command Line Interface
                ========================================================
                --> 
                <div class="vfs-window cli-win"> <!-- This is a style combination. Intentional? -->
                    
                    <!--
                    SHELL HEADER
                    -->
                    <div class="cli-header">P.SHELL.meyer</div> 
                    

                    <!--
                    OUTPUT AREA
                    -->
                    <div id="cli-output"></div>

                    <!--
                    INPUT AREA
                    -->
                    <div class="cli-input-area">
                        <span class="prompt">/MyProject/ $&gt; </span>
                        <input type="text" id="cli-input" autocomplete="off" spellcheck="false">                    	
                    </div>
                
                </div>

                <!--
                ========================================================
                    Virtual File System                
                ========================================================
                -->
                <div class="vfs-header">
                    <span class="vfs-path">/MyProject/</span>
                </div>

                <!--
                ========================================================
                    Text Editor              
                ========================================================
                -->
                <!-- Editor window -->
                <div class="vfs-window editor-win">
                    <div class="vfs-toolbar">
                        <div id="file-tabs"></div>
                        <button id="add-file-btn">+ New</button>	<!-- Previously missing -->
                    </div>
                    <textarea id="vfs-editor" spellcheck="false"></textarea>
                </div>

                <!--
                ========================================================
                -->  
            

            </div>
        </div>
    </div>
</body>

</html>
