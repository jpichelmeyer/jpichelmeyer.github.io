
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  :root {
    --green: #41ff00;
    --green-dim: #1a6600;
    --green-bright: #90ff60;
    --amber: #ffb000;
    --bg: #0a0a0a;
    --bezel: #c8c0a8;

  }

    position: relative;
  }
  #logo-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }

  #model-text { font-size: 10px; color: var(--bezel-darker); letter-spacing: 1px; }
  #screen-housing {
    background: var(--bezel-dark);
    border-radius: 10px 10px 4px 4px;
    padding: 14px 14px 10px;
    border: 2px solid var(--bezel-darker);
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
  }
  #screen {
    background: var(--screen-bg);
    border-radius: 6px;

    min-height: 340px;
    border: 2px inset #000;

    position: relative; overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px; line-height: 1.5;
    color: var(--green);

  }
  #screen::before {
    content: '';
    position: absolute; inset: 0;

  }

  }

  .bright { color: var(--green-bright); }
  .dim { color: var(--green-dim); }
  .amber { color: var(--amber); }
  .inverse { background: var(--green); color: var(--screen-bg); padding: 0 2px; }
  #keyboard {
    background: var(--bezel-dark);
    border-radius: 4px 4px 8px 8px;
    margin-top: 8px; padding: 10px 12px 12px;
    border: 1px solid var(--bezel-darker);
  }
  #input-row {
    display: flex; gap: 6px; align-items: center; margin-top: 6px;
  }
  #cmd-input {
    flex: 1;
    background: #1a1a1a; color: var(--green);
    border: 1px solid #444; border-radius: 3px;
    padding: 6px 10px; font-family: 'Share Tech Mono', monospace;
    font-size: 14px; outline: none;
  }
  #cmd-input:focus { border-color: var(--green-dim); }
  #enter-btn {
    background: var(--key-top); color: #333;
    border: none; border-radius: 3px;
    padding: 6px 14px; font-family: 'Share Tech Mono', monospace;
    font-size: 12px; cursor: pointer; letter-spacing: 1px;
    border-bottom: 3px solid var(--key-side);
    transition: transform 0.05s;
  }
  #enter-btn:active { transform: translateY(2px); border-bottom-width: 1px; }
  #quick-btns {
    display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px;
  }
  .qbtn {
    background: var(--key-top); color: #333;
    border: none; border-radius: 3px;
    padding: 4px 10px; font-family: 'Share Tech Mono', monospace;
    font-size: 11px; cursor: pointer; letter-spacing: 1px;
    border-bottom: 2px solid var(--key-side);
  }
  .qbtn:active { transform: translateY(1px); border-bottom-width: 1px; }
  .qbtn.active { background: var(--green-dim); color: var(--green-bright); border-bottom-color: #0a2200; }
  #drive-light {
    width: 8px; height: 8px; border-radius: 50%;
    background: #440000; margin-left: auto;
    box-shadow: 0 0 4px #440000;
    transition: background 0.1s, box-shadow 0.1s;
  }
  #drive-light.on { background: #ff2200; box-shadow: 0 0 8px #ff4400; }
  .game-area { margin-top: 4px; }
  .game-btn {
    display: inline-block;
    background: transparent; color: var(--green);
    border: 1px solid var(--green-dim);
    padding: 2px 8px; margin: 2px; cursor: pointer;
    font-family: 'Share Tech Mono', monospace; font-size: 13px;
    transition: background 0.1s;
  }
  .game-btn:hover { background: var(--green-dim); }
  .game-btn.selected { background: var(--green); color: var(--screen-bg); }
  progress-bar { display: block; margin: 4px 0; }
</style>

<div id="computer">
  <div id="logo-bar">
    <div id="apple-logo">&#9670; APPLE ][</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="drive-light"></div>
      <div id="model-text">CS TUTOR v1.0</div>
    </div>
  </div>
  <div id="screen-housing">
    <div id="screen">
      <div id="output"></div>
    </div>
  </div>
  <div id="keyboard">
    <div id="quick-btns">
      <button class="qbtn" onclick="loadGame('menu')">HOME</button>
      <button class="qbtn" id="btn-binary" onclick="loadGame('binary')">BINARY</button>
      <button class="qbtn" id="btn-sort" onclick="loadGame('sort')">SORTING</button>
      <button class="qbtn" id="btn-logic" onclick="loadGame('logic')">LOGIC GATES</button>
      <button class="qbtn" id="btn-memory" onclick="loadGame('memory')">MEMORY</button>
      <button class="qbtn" id="btn-algo" onclick="loadGame('algo')">BIG-O</button>
    </div>
    <div id="input-row">
      <input id="cmd-input" type="text" placeholder="] TYPE ANSWER OR COMMAND..." autocomplete="off" />
      <button id="enter-btn" onclick="submitInput()">RETURN</button>
    </div>
  </div>
</div>

<script>
const out = document.getElementById('output');
const inp = document.getElementById('cmd-input');
let currentGame = null;
let gameState = {};

function flash() {
  const dl = document.getElementById('drive-light');
  dl.classList.add('on');
  setTimeout(() => dl.classList.remove('on'), 300);
}

function setActivBtn(id) {
  document.querySelectorAll('.qbtn').forEach(b => b.classList.remove('active'));
  if (id) document.getElementById(id)?.classList.add('active');
}

function print(text, cls='') {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}

function println(text='', cls='') { print(text + '\n', cls); }

function clearScreen() { out.innerHTML = ''; }

function printHeader(title) {
  println();
  println('################################', 'dim');
  println('  ' + title, 'bright');
  println('################################', 'dim');
  println();
}

function addGameBtn(label, cb) {
  const btn = document.createElement('button');
  btn.className = 'game-btn';
  btn.textContent = label;
  btn.onclick = cb;
  out.appendChild(btn);
}

function submitInput() {
  const val = inp.value.trim().toUpperCase();
  inp.value = '';
  if (!val) return;
  flash();
  println();
  println('] ' + val, 'amber');
  if (currentGame) currentGame(val);
  else handleMenu(val);
}

inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });

function handleMenu(cmd) {
  if (cmd === '1') loadGame('binary');
  else if (cmd === '2') loadGame('sort');
  else if (cmd === '3') loadGame('logic');
  else if (cmd === '4') loadGame('memory');
  else if (cmd === '5') loadGame('algo');
  else { println('?SYNTAX ERROR', 'amber'); println('TYPE 1-5 TO SELECT A PROGRAM.'); }
}

function showMenu() {
  clearScreen();
  setActivBtn(null);
  currentGame = null;
  flash();
  println('**** CS TUTOR SYSTEM  ****', 'bright');
  println(' APPLE ][ EDUCATIONAL SUITE', 'dim');
  println();
  println('SELECT A PROGRAM:', 'bright');
  println();
  println(' [1]  BINARY NUMBERS QUIZ', 'bright');
  println('      LEARN BINARY COUNTING');
  println();
  println(' [2]  BUBBLE SORT VISUALIZER');
  println('      WATCH SORTING IN ACTION', 'bright');
  println();
  println(' [3]  LOGIC GATE TRAINER', 'bright');
  println('      AND, OR, XOR, NOT GATES');
  println();
  println(' [4]  MEMORY ADDRESS GAME');
  println('      HEX ADDRESSING + POINTERS', 'bright');
  println();
  println(' [5]  BIG-O COMPLEXITY QUIZ', 'bright');
  println('      O(1) O(N) O(N^2) ETC.');
  println();
  println('TYPE 1-5 OR CLICK ABOVE KEYS', 'dim');
}

// ─── GAME 1: BINARY ───────────────────────────────────────────────────────
function loadBinary() {
  setActivBtn('btn-binary');
  clearScreen();
  printHeader('BINARY NUMBERS QUIZ');
  println('CONVERT DECIMAL TO BINARY!', 'bright');
  println('ENTER 8-BIT BINARY (EX: 01001010)', 'dim');
  println();
  newBinaryQuestion();
}

function newBinaryQuestion() {
  gameState.bnum = Math.floor(Math.random() * 256);
  gameState.score = gameState.score || 0;
  gameState.streak = gameState.streak || 0;
  println(`SCORE: ${gameState.score}  STREAK: ${gameState.streak}`, 'dim');
  println();
  print('CONVERT TO BINARY:  ', 'dim');
  println(String(gameState.bnum), 'bright');
  println();
  println('BIT POSITIONS: 128 64 32 16  8  4  2  1', 'dim');
  println();
  currentGame = checkBinary;
}

function checkBinary(ans) {
  const correct = gameState.bnum.toString(2).padStart(8, '0');
  const clean = ans.replace(/\s/g, '');
  if (!/^[01]{8}$/.test(clean)) { println('ENTER EXACTLY 8 BITS (0s AND 1s)', 'amber'); return; }
  if (clean === correct) {
    gameState.score += 10 + gameState.streak * 2;
    gameState.streak++;
    println('** CORRECT! **', 'bright');
    println(`+${10 + (gameState.streak-1)*2} POINTS!`, 'bright');
    if (gameState.streak > 1) println(`STREAK BONUS x${gameState.streak}!`, 'amber');
  } else {
    gameState.streak = 0;
    println('WRONG.', 'amber');
    println(`CORRECT: ${correct}`, 'dim');
    println('LET\'S BREAK IT DOWN:', 'dim');
    const bits = correct.split('');
    const vals = [128,64,32,16,8,4,2,1];
    let breakdown = '';
    bits.forEach((b,i) => { if (b==='1') breakdown += `${vals[i]}+`; });
    println((breakdown.slice(0,-1)||'0') + ` = ${gameState.bnum}`, 'dim');
  }
  println();
  println('PRESS RETURN FOR NEXT...', 'dim');
  currentGame = (v) => { newBinaryQuestion(); };
}

// ─── GAME 2: BUBBLE SORT ──────────────────────────────────────────────────
function loadSort() {
  setActivBtn('btn-sort');
  clearScreen();
  printHeader('BUBBLE SORT VISUALIZER');
  println('WATCH THE ALGORITHM WORK!', 'bright');
  println();
  gameState.arr = Array.from({length:8}, () => Math.floor(Math.random()*99)+1);
  gameState.sortStep = 0;
  gameState.sortI = 0;
  gameState.sortJ = 0;
  gameState.sortDone = false;
  gameState.swaps = 0;
  gameState.comparisons = 0;
  drawArray();
  println();
  println('HOW BUBBLE SORT WORKS:', 'dim');
  println('COMPARE ADJACENT PAIRS.', 'dim');
  println('SWAP IF LEFT > RIGHT.', 'dim');
  println('REPEAT UNTIL SORTED!', 'dim');
  println();
  println('PRESS RETURN TO STEP FORWARD', 'bright');
  println('TYPE "RUN" TO AUTO-COMPLETE', 'dim');
  currentGame = sortStep;
}

function drawArray() {
  const arr = gameState.arr;
  const j = gameState.sortJ;
  let row = '';
  arr.forEach((v,i) => {
    const s = String(v).padStart(3);
    if (!gameState.sortDone && (i===j||i===j+1)) row += `[${s}]`;
    else row += ` ${s} `;
  });
  println(row, 'bright');
  let bars = arr.map(v => {
    const h = Math.ceil(v/10);
    return '|'.repeat(h).padEnd(10);
  });
  for (let r=9; r>=1; r--) {
    let line = '';
    arr.forEach((v,i) => {
      const h = Math.ceil(v/10);
      const c = h >= r ? '#' : ' ';
      if (!gameState.sortDone && (i===j||i===j+1)) line += ` ${c}  `;
      else line += ` ${c}  `;
    });
    out.appendChild(document.createTextNode(line.replace(/./g, c => {
      return c;
    })));
    println('');
  }
}

function sortStep(cmd) {
  if (gameState.sortDone) { loadSort(); return; }
  const arr = gameState.arr;
  const n = arr.length;
  if (cmd === 'RUN') {
    let changed = true;
    while (changed) {
      changed = false;
      for (let i=0; i<n-1; i++) {
        gameState.comparisons++;
        if (arr[i] > arr[i+1]) { [arr[i],arr[i+1]]=[arr[i+1],arr[i]]; gameState.swaps++; changed=true; }
      }
    }
    gameState.sortDone = true;
    gameState.sortJ = -1;
    clearScreen();
    printHeader('BUBBLE SORT VISUALIZER');
    println('** SORTED! **', 'bright');
    drawArray();
    println();
    println(`TOTAL COMPARISONS: ${gameState.comparisons}`, 'dim');
    println(`TOTAL SWAPS: ${gameState.swaps}`, 'dim');
    println(`WORST CASE: O(N^2) = ${n*n}`, 'dim');
    println();
    println('PRESS RETURN TO SORT NEW ARRAY', 'bright');
    return;
  }
  const j = gameState.sortJ;
  gameState.comparisons++;
  let swapped = false;
  if (arr[j] > arr[j+1]) { [arr[j],arr[j+1]]=[arr[j+1],arr[j]]; gameState.swaps++; swapped=true; }
  clearScreen();
  printHeader('BUBBLE SORT VISUALIZER');
  println(`COMPARING POSITIONS ${j} AND ${j+1}:`, 'dim');
  if (swapped) println(`SWAPPED ${arr[j+1]} <-> ${arr[j]}`, 'amber');
  else println('NO SWAP NEEDED', 'dim');
  println(`COMPARISONS: ${gameState.comparisons}  SWAPS: ${gameState.swaps}`, 'dim');
  println();
  gameState.sortJ++;
  if (gameState.sortJ >= n-1-gameState.sortStep) { gameState.sortStep++; gameState.sortJ=0; }
  let sorted = true;
  for (let i=0;i<n-1;i++) { if(arr[i]>arr[i+1]){sorted=false;break;} }
  if (sorted) { gameState.sortDone = true; gameState.sortJ=-1; }
  drawArray();
  println();
  if (gameState.sortDone) { println('** ARRAY IS SORTED! **','bright'); println('PRESS RETURN FOR NEW ARRAY','dim'); }
  else println('RETURN=NEXT STEP  RUN=AUTO', 'dim');
}

// ─── GAME 3: LOGIC GATES ──────────────────────────────────────────────────
const gates = {
  AND:  (a,b)=>a&b,
  OR:   (a,b)=>a|b,
  XOR:  (a,b)=>a^b,
  NAND: (a,b)=>a&b?0:1,
  NOR:  (a,b)=>a|b?0:1,
};
const gateArt = {
  AND:  ['   ___  ','A-|   )-OUT','B-|___) '],
  OR:   ['   ___  ','A-|   >-OUT','B-|___> '],
  XOR:  ['  ____  ','A-|    >-OUT','B-|)___> '],
  NAND: ['   ___ o','A-|   ) -OUT','B-|___) '],
  NOR:  ['   ___ o','A-|   > -OUT','B-|___> '],
};

function loadLogic() {
  setActivBtn('btn-logic');
  clearScreen();
  printHeader('LOGIC GATE TRAINER');
  gameState.score = 0;
  gameState.streak = 0;
  println('BINARY LOGIC GATES!', 'bright');
  println('A AND B CAN BE 0 OR 1', 'dim');
  println();
  newLogicQ();
}

function newLogicQ() {
  const gnames = Object.keys(gates);
  gameState.gate = gnames[Math.floor(Math.random()*gnames.length)];
  gameState.a = Math.round(Math.random());
  gameState.b = Math.round(Math.random());
  const art = gateArt[gameState.gate];
  println(`GATE: ${gameState.gate}`, 'bright');
  println();
  art.forEach(l => println('  '+l));
  println();
  println(`A = ${gameState.a}`, 'bright');
  println(`B = ${gameState.b}`, 'bright');
  println();
  println(`WHAT IS THE OUTPUT? (0 OR 1)`, 'dim');
  println(`SCORE: ${gameState.score}  STREAK: ${gameState.streak}`, 'dim');
  currentGame = checkLogic;
}

function checkLogic(ans) {
  if (ans !== '0' && ans !== '1') { println('ENTER 0 OR 1', 'amber'); return; }
  const correct = gates[gameState.gate](gameState.a, gameState.b);
  const fn = { AND:'BOTH MUST BE 1', OR:'AT LEAST ONE IS 1', XOR:'EXACTLY ONE IS 1', NAND:'OPPOSITE OF AND', NOR:'OPPOSITE OF OR' };
  if (parseInt(ans) === correct) {
    gameState.score += 10; gameState.streak++;
    println('CORRECT!', 'bright');
    println(`RULE: ${fn[gameState.gate]}`, 'dim');
  } else {
    gameState.streak = 0;
    println(`WRONG. ANSWER WAS: ${correct}`, 'amber');
    println(`RULE: ${fn[gameState.gate]}`, 'dim');
  }
  println();
  println('PRESS RETURN FOR NEXT GATE...', 'dim');
  currentGame = () => newLogicQ();
}

// ─── GAME 4: MEMORY ADDRESS ───────────────────────────────────────────────
function loadMemory() {
  setActivBtn('btn-memory');
  clearScreen();
  printHeader('MEMORY ADDRESS GAME');
  println('LEARN HEX ADDRESSING!', 'bright');
  println('MEMORY IS STORED IN CELLS.', 'dim');
  println('ADDRESSES ARE IN HEX (BASE 16)', 'dim');
  println('0-9 THEN A=10, B=11 ... F=15', 'dim');
  println();
  gameState.score = 0;
  newMemoryQ();
}

function newMemoryQ() {
  const types = ['hex2dec','dec2hex','addr'];
  gameState.memType = types[Math.floor(Math.random()*types.length)];
  if (gameState.memType === 'hex2dec') {
    const n = Math.floor(Math.random()*256);
    gameState.memAns = n;
    gameState.memQ = n.toString(16).toUpperCase().padStart(2,'0');
    println('SCORE: ' + gameState.score, 'dim');
    println();
    println('CONVERT HEX TO DECIMAL:', 'bright');
    println();
    println('  ADDRESS   VALUE', 'dim');
    const addr = Math.floor(Math.random()*0x1000).toString(16).toUpperCase().padStart(4,'0');
    println(`  $${addr}    $${gameState.memQ}  <-- WHAT IS THIS?`, 'bright');
    println();
    println('TYPE THE DECIMAL VALUE (0-255)', 'dim');
  } else if (gameState.memType === 'dec2hex') {
    const n = Math.floor(Math.random()*256);
    gameState.memAns = n.toString(16).toUpperCase().padStart(2,'0');
    println('SCORE: ' + gameState.score, 'dim');
    println();
    println('CONVERT DECIMAL TO HEX:', 'bright');
    println(`THE VALUE IS: ${n}`, 'bright');
    println();
    println('HEX DIGITS: 0123456789ABCDEF', 'dim');
    println('16^1=16   16^0=1', 'dim');
    println();
    println('TYPE THE 2-DIGIT HEX (EX: 2A)', 'dim');
  } else {
    const base = Math.floor(Math.random()*0xF00) + 0x100;
    const offset = Math.floor(Math.random()*16);
    gameState.memAns = (base+offset).toString(16).toUpperCase().padStart(4,'0');
    println('SCORE: ' + gameState.score, 'dim');
    println();
    println('POINTER ARITHMETIC!', 'bright');
    println(`BASE ADDRESS: $${base.toString(16).toUpperCase().padStart(4,'0')}`, 'bright');
    println(`OFFSET:       +${offset} BYTES`, 'bright');
    println();
    println('TYPE THE FINAL HEX ADDRESS', 'dim');
  }
  currentGame = checkMemory;
}

function checkMemory(ans) {
  const a = ans.replace('$','').replace('0X','').trim();
  const correct = String(gameState.memAns).toUpperCase();
  if (a === correct) {
    gameState.score += 10;
    println('CORRECT!', 'bright');
    println(`SCORE: ${gameState.score}`, 'dim');
  } else {
    println(`WRONG. ANSWER: ${correct}`, 'amber');
    if (gameState.memType === 'hex2dec') {
      const h = gameState.memQ;
      const hi = parseInt(h[0],16), lo = parseInt(h[1],16);
      println(`${hi} x 16 + ${lo} = ${hi*16+lo}`, 'dim');
    }
  }
  println();
  println('PRESS RETURN FOR NEXT...', 'dim');
  currentGame = () => newMemoryQ();
}

// ─── GAME 5: BIG-O ────────────────────────────────────────────────────────
const bigo = [
  {q:'LOOKING UP AN ITEM BY INDEX IN AN ARRAY', a:'O(1)', exp:'DIRECT ACCESS. NO SEARCHING NEEDED.'},
  {q:'SEARCHING A SORTED LIST WITH BINARY SEARCH', a:'O(LOG N)', exp:'HALVES THE SEARCH SPACE EACH TIME.'},
  {q:'LOOPING THROUGH ALL N ITEMS ONCE', a:'O(N)', exp:'ONE OPERATION PER ITEM.'},
  {q:'NESTED LOOP: FOR EACH ITEM, CHECK ALL ITEMS', a:'O(N^2)', exp:'N ITEMS * N CHECKS = N SQUARED.'},
  {q:'MERGE SORT OR HEAP SORT', a:'O(N LOG N)', exp:'DIVIDE + CONQUER STRATEGY.'},
  {q:'GENERATING ALL SUBSETS OF A SET', a:'O(2^N)', exp:'EXPONENTIAL. DOUBLES WITH EACH NEW ITEM.'},
  {q:'FINDING AN ITEM IN A HASH TABLE (AVERAGE)', a:'O(1)', exp:'HASH FUNCTION GIVES DIRECT LOCATION.'},
  {q:'LINEAR SEARCH IN UNSORTED ARRAY', a:'O(N)', exp:'MIGHT HAVE TO CHECK EVERY ITEM.'},
  {q:'SELECTION SORT', a:'O(N^2)', exp:'FINDS MIN N TIMES, EACH SCAN IS N.'},
  {q:'RECURSIVE FIBONACCI (NAIVE)', a:'O(2^N)', exp:'EACH CALL BRANCHES INTO 2 MORE CALLS.'},
];

function loadAlgo() {
  setActivBtn('btn-algo');
  clearScreen();
  printHeader('BIG-O COMPLEXITY QUIZ');
  println('CLASSIFY THE TIME COMPLEXITY!', 'bright');
  println();
  println('CHOICES: O(1) O(LOG N) O(N)', 'dim');
  println('         O(N LOG N) O(N^2) O(2^N)', 'dim');
  println();
  gameState.score = 0;
  gameState.seen = new Set();
  newBigoQ();
}

function newBigoQ() {
  let idx;
  if (gameState.seen.size >= bigo.length) gameState.seen.clear();
  do { idx = Math.floor(Math.random()*bigo.length); } while (gameState.seen.has(idx));
  gameState.seen.add(idx);
  gameState.bigoQ = bigo[idx];
  println('SCORE: ' + gameState.score, 'dim');
  println();
  println('ALGORITHM:', 'bright');
  const words = gameState.bigoQ.q.split(' ');
  let line = '';
  words.forEach(w => {
    if ((line+w).length > 36) { println('  '+line,'bright'); line=''; }
    line += w + ' ';
  });
  if (line) println('  '+line.trim(), 'bright');
  println();
  println('WHAT IS THE TIME COMPLEXITY?', 'dim');
  println('(TYPE LIKE: O(N) OR O(N^2))', 'dim');
  currentGame = checkBigo;
}

function checkBigo(ans) {
  const norm = ans.replace(/\s/g,'').toUpperCase();
  const correct = gameState.bigoQ.a.replace(/\s/g,'').toUpperCase();
  if (norm === correct) {
    gameState.score += 10;
    println('CORRECT!', 'bright');
    println(gameState.bigoQ.exp, 'dim');
  } else {
    println(`WRONG. ANSWER: ${gameState.bigoQ.a}`, 'amber');
    println(gameState.bigoQ.exp, 'dim');
  }
  println();
  println('PRESS RETURN FOR NEXT...', 'dim');
  currentGame = () => newBigoQ();
}

// ─── BOOT ─────────────────────────────────────────────────────────────────
function loadGame(id) {
  flash();
  gameState = {};
  if (id==='menu') showMenu();
  else if (id==='binary') loadBinary();
  else if (id==='sort') loadSort();
  else if (id==='logic') loadLogic();
  else if (id==='memory') loadMemory();
  else if (id==='algo') loadAlgo();
}

  clearScreen();
  const lines = [
    '**** APPLE ][ CS TUTOR ****',

    'LOADING PROGRAM LIBRARY...',
    '',
    '  [##########] 100%',

    '5 PROGRAMS READY.',
    '',
    'READY.',
  ];
  let i=0;
  const t = setInterval(() => {
