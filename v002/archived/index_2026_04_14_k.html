/*
=====================================================================
/html/head/script/
=====================================================================
*/

        	fetch('style/style.html')
            	.then(r => r.text())
            	.then(html => {
                	const parser = new DOMParser();
                	const doc = parser.parseFromString(html, 'text/html');
                	doc.querySelectorAll('style').forEach(el => {
                    	document.head.insertAdjacentHTML('beforeend', el.outerHTML);
                	});
            	});
            	
            	
    	</script>

<body>

=====================================================================
-->

	

    <!-- 
    ═══════════════════════════════════════════
         BOOT SCREEN
    ═══════════════════════════════════════════ 
    -->
    <div id="pos-boot">
        <div class="boot-logo">
            <span style="font-size:9px;letter-spacing:6px;opacity:0.7">PICHELMEYER OPERATING SYSTEM</span>
        </div>
        
        <!--
        .....................................<br>
		.....................................<br>
		.........██████╗..██████╗.███████╗...<br>
		.........██╔══██╗██╔═══██╗██╔════╝...<br>
		.........██████╔╝██║.. ██║███████╗...<br>
		.........██╔═══╝.██║.. ██║╚════██║...<br>
		.........██║.....╚██████╔╝███████║...<br>
		.........╚═╝......╚═════╝.╚══════╝...<br>
		.....................................<br>
            		<br>
        -->
        
        <div class="boot-log"></div>
        <div class="boot-skip">[ press ENTER to proceed ]</div>
        
        <!-- filling boot-logo -->
        <script>
        	
        	function drawLogoOnCanvas(rowStrings = [], rowStart = 0, colStart = 0) {
    			let posLines = [
        			'██████╗..██████╗.███████╗...',
        			'██╔══██╗██╔═══██╗██╔════╝...',
        			'██████╔╝██║.. ██║███████╗...',
        			'██╔═══╝.██║.. ██║╚════██║...',
        			'██║.....╚██████╔╝███████║...',
        			'╚═╝......╚═════╝.╚══════╝...'
    			];
			
    			let rowStringsNew = [...rowStrings]; // Copy the original dots
			
    			for (let i = 0; i < posLines.length; i++) {
        			let targetRowIndex = i + rowStart;
        			
        			// Make sure we don't go out of bounds of our "canvas"
        			if (targetRowIndex < rowStringsNew.length) {
            			let rowChars = rowStringsNew[targetRowIndex].split('');
            			let posLineChars = posLines[i].split('');
			
            			for (let j = 0; j < posLineChars.length; j++) {
                			if (colStart + j < rowChars.length) {
                    			rowChars[colStart + j] = posLineChars[j];
                			}
            			}
            			rowStringsNew[targetRowIndex] = rowChars.join('');
        			}
    			}
    			return rowStringsNew;
			}
			
			function fillLogo(rows = 20, cols = 50) {
    			let rowStrings = [];
    			for (let row = 0; row < rows; row++) {
        			rowStrings.push(".".repeat(cols)); // Cleaner way to make a row of dots
    			}
    			
    			rowStrings = drawLogoOnCanvas(rowStrings, 3, 3);
    			const container = document.querySelector('.boot-logo');
    			if (container) {
        			container.innerHTML = rowStrings.join('<br>');
    			}
			}
			
			fillLogo();
        </script>
        
    </div>

    <!--

         DESKTOP SURFACE
         Windows are injected here by pos.js
