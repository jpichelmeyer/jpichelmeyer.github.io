<!DOCTYPE html>

	<head>
<!--
=====================================================================
/html/head/
=====================================================================
-->


    	<meta charset="UTF-8">
    	<meta name="viewport" content="width=device-width, initial-scale=1">
    	<title>POS — Pichelmeyer Operating System</title>
    	<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
	
    	<!-- POS core styles -->
    	<link rel="stylesheet" href="pos/pos.css">
	
    	<!-- Shared site styles (tokens, tags, tables, etc.) -->
    	<script>
/*
=====================================================================
/html/head/script/
=====================================================================
*/

        	fetch('style/style.html')
            	.then(r => r.text())
            	.then(html => {
                	const parser = new DOMParser();
                	const doc = parser.parseFromString(html, 'text/html');
                	doc.querySelectorAll('style').forEach(el => {
                    	document.head.insertAdjacentHTML('beforeend', el.outerHTML);
                	});
            	});
            	
            	
    	</script>
	
    	<!-- Terminal scripts -->
    	<script src="terminal/interpreters.js"></script>
    	<script src="terminal/terminal.js"></script>

<!--
=====================================================================
/html/head/
=====================================================================
-->



	</head>

<!--
=====================================================================
/html/
=====================================================================
-->



<body>

<!--

=====================================================================
-->

    <!--

         BOOT SCREEN
    ═══════════════════════════════════════════

    <div id="pos-boot">
        <div class="boot-logo">
............██████╗  ██████╗ ███████╗<br>

............██║     ╚██████╔╝███████║<br>
