  <style
     id="style6">
    .whisker { stroke: #000; stroke-width: 3; stroke-linecap: round; }
    .antenna-wire {
      fill: none; stroke: #000; stroke-width: 3.2; stroke-linecap: round;
      transform-origin: 119px 96px;
      animation: sway 6s ease-in-out infinite alternate;
    }
    @keyframes sway {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(3deg) translateY(-2px); }
      100% { transform: rotate(-3deg) translateY(0px); }
    }
    .antenna-bulb { animation: pulse-glow 3s ease-in-out infinite alternate; }
    @keyframes pulse-glow {
      0%   { r: 14px; opacity: 0.5; }
      100% { r: 21px; opacity: 0.9; }
    }
  </style>
