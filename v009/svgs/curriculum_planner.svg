<!-- svgs/curriculum_planner.svg : a spreadsheet with a face. Same 22x22 / black-line style as dull.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" version="1.1" x="0px" y="0px">
    <g fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <!-- sheet body -->
        <rect x="1.5" y="1.5" width="19" height="19" rx="1.2"/>
        <!-- header row and row-label column -->
        <path d="M1.5,5.5 H20.5 M6.5,1.5 V20.5"/>
        <!-- row ticks and column ticks -->
        <path d="M1.5,9.5 H6.5 M1.5,13.5 H6.5 M1.5,17.5 H6.5 M11.5,1.5 V5.5 M16,1.5 V5.5"/>
        <!-- eyes: ring + pupil, like the file icon's -->
        <circle cx="10.75" cy="10.5" r="1.9"/>
        <circle cx="16.25" cy="10.5" r="1.9"/>
        <!-- mouth: a content little smile -->
        <path d="M10.5,15.2 Q13.5,18 16.5,15.2"/>
    </g>
    <g fill="#000000">
        <circle cx="11.1" cy="10.5" r="0.7"/>
        <circle cx="16.6" cy="10.5" r="0.7"/>
    </g>
</svg>
