<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ants &amp; Pheromones</title>
    <!-- "./" (not "/") on purpose -- this app is meant to be embedded
         as a relocatable subfolder (blazor/ants-pheromone/), exactly
         like the Godot Web exports under godot/. If dotnet's template
         generated "/" here, change it back to "./" before publishing. -->
    <base href="./" />
    <style>
        body { margin: 0; background: #14140f; color: #d9d4c4; font-family: monospace; }
        .ants-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 10px 4px; font-family: sans-serif; font-size: 12px; }
        .ants-toolbar button { font-family: inherit; font-size: 12px; padding: 5px 12px; border: 1px solid #4a4740; border-radius: 6px; background: #23221c; color: #d9d4c4; cursor: pointer; }
        .ants-toolbar button:hover { border-color: #d9d4c4; }
        .ants-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
        .ants-stat { opacity: 0.75; }
        .ants-hint { padding: 0 10px 8px; font-size: 11px; opacity: 0.6; font-family: sans-serif; }
        .ants-grid { display: grid; line-height: 1; font-size: 14px; padding: 0 10px 10px; white-space: pre; }
        .ants-cell { width: 1ch; text-align: center; cursor: pointer; user-select: none; }
        .ant     { color: #e0c34a; }
        .ant-fed { color: #7CFC00; font-weight: bold; }
        .nest    { color: #66c2ff; font-weight: bold; }
        .food    { color: #ff8844; }
        .bias    { color: #bb88ff; }
    </style>
</head>
<body>
    <div id="app">Loading&hellip;</div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
